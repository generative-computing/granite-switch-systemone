name: Image

# Builds the Docker images and pushes them to GitHub Container Registry for linux/amd64 and
# linux/arm64. Runs on a version tag, or by hand against any ref (leave "push" off to build
# without publishing). Each architecture builds on a native runner and pushes by digest; a
# second job then joins the two into one multi-arch tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUSH: ${{ github.event_name == 'push' || inputs.push }}

jobs:
  build:
    # Two images per release: the default (decisions only, no speech model inside) and an
    # `-asr` variant with the pinned speech model baked in, for chat speech input.
    name: build (${{ matrix.variant }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        variant: [default, asr]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - variant: default
            with_asr: "0"
          - variant: asr
            with_asr: "1"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # The base image is large; the runner's default free disk is not enough.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: WITH_ASR=${{ matrix.with_asr }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH == 'true' }}
      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: tag (${{ matrix.variant }})
    if: ${{ github.event_name == 'push' || inputs.push }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # `latest` stays the default image; the asr image gets `latest-asr` (onlatest=true),
          # so the two variants never push the same tag.
          - variant: default
            flavor: "latest=auto"
          - variant: asr
            flavor: "suffix=-asr,onlatest=true"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: ${{ matrix.flavor }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
